name: AALpy GUI Regression CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  aalpy-gui-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsdl2-dev imagemagick

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aalpy Pillow pydot

      - name: Configure and Build C++ Driver
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --target aalpy_sul_driver

      - name: Run AALpy GUI Regression Test
        run: |
          xvfb-run python3 scripts/aalpy_gui_regression.py

      - name: Upload Regression Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aalpy-regression-diffs
          path: tests/integration/reference_screenshots/actual_*.bmp
